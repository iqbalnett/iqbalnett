  <text x="58" y="222" fill="#fafafa" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="700" letter-spacing="-9">IQBAL</text>
  <path d="M 64 267 H 1136" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  <circle cx="64" cy="267" r="5" fill="#fafafa"/>
  <circle cx="1136" cy="267" r="5" fill="#fafafa"/>
  <text x="64" y="308" fill="#f0f0f0" font-family="Arial, Helvetica, sans-serif" font-size="36">FlowJob</text>
